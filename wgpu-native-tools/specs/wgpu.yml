        doc: |
          X11 screen number.
        type: int32
  - name: wayland_display_handle
    doc: |
      Wayland display connection data for @ref WGPUNativeDisplayHandle.
    type: standalone
    members:
      - name: display
        doc: |
          Pointer to the Wayland display (i.e. `wl_display`*). Must not be NULL.
        type: c_void
        pointer: mutable
  - name: native_display_handle
    doc: |
      Platform display connection, passed as a field of @ref WGPUInstanceExtras.

      This is a tagged union. Set `type` to indicate which variant is active, then
      populate the corresponding field in `data`. Zero-initialization yields
      @ref WGPUNativeDisplayHandleType_None, meaning no display handle is provided.

      Currently required by the GLES backend when presenting on Wayland. Other
      backends ignore this field. If the instance is created with a display handle,
      all surfaces created from it must use the same display connection.
    type: standalone
    members:
      - name: type
        doc: |
          Which variant of `data` is active.
        type: enum.native_display_handle_type
      - name: data
        doc: |
          C union of @ref WGPUXlibDisplayHandle, @ref WGPUXcbDisplayHandle and @ref WGPUWaylandDisplayHandle.
          The schema has no unions, so the member is typed as the largest variant (same size and alignment as
          the union); for Xcb or Wayland write the variant's fields in the same positions.
        type: struct.xlib_display_handle
  - name: instance_extras
    doc: |
      Additional instance creation parameters used by wgpu-native.
    type: extension
    extends:
      - instance_descriptor
    members:
      - name: backends
        doc: |
          Which backends to enable.
          Zero (@ref WGPUInstanceBackend_All) enables all backends.
        type: bitflag.instance_backend
      - name: flags
        doc: |
          Flags controlling debug/validation behavior.
          See @ref WGPUInstanceFlag for available flags.
        type: bitflag.instance_flag
      - name: dx12_shader_compiler
        doc: |
          Which DX12 shader compiler to use.
          See @ref WGPUDx12Compiler. Ignored on non-DX12 backends.
        type: enum.dx12_compiler
      - name: gles3_minor_version
        doc: |
          Which OpenGL ES 3 minor version to request.
          See @ref WGPUGles3MinorVersion. Ignored on non-GL backends.
        type: enum.gles3_minor_version
      - name: gl_fence_behaviour
        doc: |
          Controls OpenGL fence synchronization behavior.
          See @ref WGPUGLFenceBehaviour. Ignored on non-GL backends.
        type: enum.GL_fence_behaviour
      - name: dxc_path
        doc: |
          File system path to `dxcompiler.dll` for dynamic DXC loading.
          Only used when `dx12ShaderCompiler` is @ref WGPUDx12Compiler_Dxc.
          An empty/undefined string view means the DLL will be searched for
          on the system PATH.
        type: string_with_default_empty
      - name: dxc_max_shader_model
        doc: |
          Maximum HLSL shader model version that DXC should target.
          See @ref WGPUDxcMaxShaderModel. Only used with the DXC compiler.
        type: enum.dxc_max_shader_model
      - name: dx12_presentation_system
        doc: |
          Which DX12 presentation system (swapchain kind) to use.
          See @ref WGPUDx12SwapchainKind. Ignored on non-DX12 backends.
        type: enum.dx12_swapchain_kind
      - name: budget_for_device_creation
        doc: |
          TODO
        type: c_void
        pointer: immutable
        optional: true
      - name: budget_for_device_loss
        doc: |
          TODO
        type: c_void
        pointer: immutable
        optional: true
      - name: display_handle
        doc: |
          Platform display connection to associate with this instance.
          Zero-initialized yields @ref WGPUNativeDisplayHandleType_None (no handle).
        type: struct.native_display_handle
  - name: device_extras
    doc: |
      Additional device creation parameters used by wgpu-native.
    type: extension
    extends:
      - device_descriptor
    members:
      - name: trace_path
        doc: |
          File system path for API trace output.

          When set to a non-empty path, wgpu will record all API calls to
          the given directory, which can later be replayed for debugging.
          An empty/undefined string view disables tracing.
