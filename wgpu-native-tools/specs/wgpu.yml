        doc: |
          X11 screen number.
        type: int32
  - name: xcb_display_handle
    doc: |
      XCB display connection data for @ref WGPUNativeDisplayHandle.
    type: standalone
    members:
      - name: connection
        doc: |
          Pointer to the XCB connection (i.e. `xcb_connection_t`*). Must not be NULL.
        type: c_void
        pointer: mutable
