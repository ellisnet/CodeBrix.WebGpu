callbacks:
  - name: log
    doc: |
      Receives wgpu-native log messages; installed with @ref wgpuSetLogCallback.

      This callback predates the two-userdata callback convention of `webgpu.h`: it takes ONE `userdata`
      pointer (declared as its last argument) and has no callback-info struct.
    style: immediate
    args:
      - name: level
        doc: |
          The severity of the message.
        type: enum.log_level
      - name: message
        doc: |
          The message text. Valid only for the duration of the call.
        type: out_string
      - name: userdata
        doc: |
          The pointer passed to @ref wgpuSetLogCallback.
        type: c_void
        pointer: mutable
