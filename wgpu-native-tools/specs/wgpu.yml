# specs/wgpu.yml - the wgpu-native extension API (wgpu.h) in the webgpu-headers YAML schema.
#
# PROVENANCE: started from ffi/wgpu.yml at wgpu-native trunk commit
# 6f7d734be9bb5d1b3f0f48c9eb3019eec1eaa21a (2026-08-14, the commit that added it; sha256 of that file
# 4ecfc578e63b1a0b382fa5d4c1868780e1f9bbbb720b63285961370c27a7c0bf). That file was neither valid against
# webgpu-headers/schema.json nor a description of the RELEASE we ship (wgpu-native v29.0.1.1), so this file
# is a re-transcription of the release's ffi/wgpu.h: every enum value, struct member and function below is
# taken from that header, and the doc text is the header's own doc comments where it has them.
#
# MAINTENANCE: this file is maintained BY HAND against wgpu-native-tools/wgpu-native/ffi/wgpu.h (the release
# has no wgpu.yml of its own). The header-parity test in tests/CodeBrix.WebGpu.BindingGenerator.Tests
# (HeaderParityTests) parses wgpu.h and webgpu.h and fails when a function name / parameter count or a struct
# name / member list here disagrees with the headers, in either direction. After a wgpu-native bump, run the
# generator tests first and edit this file until the parity test passes.
#
# Transcription rules worth knowing (see MAINTAINER-README.txt, "THE BINDING GENERATOR"):
#   * Names: C name = WGPU + PascalCase(name) with the reference generator's PascalCase, which keeps the case
#     of every character it does not capitalise (so `GL_fence_behaviour` -> GLFenceBehaviour) and turns a
#     double underscore into a literal one (`v6__0` -> V6_0).
#   * Enum blocks: entries take this file's enum_prefix (0x0003) unless the enum or entry says
#     `namespace: webgpu`, which selects the core block 0x0000 - schema.json describes an entry namespace as
#     "applying both its name prefix and its enum block". wgpu.h's own enums (LogLevel, Dx12Compiler, ...)
#     are numbered from 0 in the core block and are marked that way.
#   * WGPUNativeSType and WGPUNativeSurfaceGetCurrentTextureStatus are written as `extended` core enums,
#     because their entries are named WGPUSType_* / WGPUSurfaceGetCurrentTextureStatus_*.
#   * WGPUNativeDisplayHandle.data is a C union of the Xlib / Xcb / Wayland handles. The schema has no
#     unions; the member is typed as the largest variant (WGPUXlibDisplayHandle, same size and alignment as
#     the union), and every variant starts with its display/connection pointer.
#   * `const uint8_t *` (InstanceExtras.budgetFor*) has no schema type; it is `c_void` pointer immutable.
#   * The log callback predates the two-userdata convention: its LAST declared argument is named
#     `userdata`, which tells the generator not to append userdata1/userdata2 and not to emit a
#     callback-info struct for it.
#   * Force32 entries are not transcribed (they only pin the C enum size).
copyright: |
  Copyright 2019-2023 wgpu-native developers

  SPDX-License-Identifier: BSD-3-Clause
name: wgpu
enum_prefix: 0x0003
doc: |
  wgpu-native specific extensions to the standard WebGPU C API (`wgpu.h`): native-only types,
  enumerations, structures and functions. Extension enum values and struct type identifiers are
  allocated in the `0x0003XXXX` range reserved for wgpu-native.
constants: []
typedefs:
  - name: submission_index
    doc: |
      Identifier for a particular call to @ref wgpuQueueSubmitForIndex.

      Can be passed to @ref wgpuDevicePoll to block until a particular
      submission has finished execution.

      This type is unique to wgpu-native; there is no analogue in the
      WebGPU specification.
    type: uint64
enums:
  - name: s_type
    doc: |
      Struct type identifiers (@ref WGPUSType values) of the wgpu-native extension structs.
    extended: true
    entries:
      - name: device_extras
        doc: |
          Identifies @ref WGPUDeviceExtras.
        value: 1
      - name: native_limits
        doc: |
          Identifies @ref WGPUNativeLimits.
        value: 2
      - name: shader_source_GLSL
        doc: |
          Identifies @ref WGPUShaderSourceGLSL.
        value: 3
      - name: instance_extras
        doc: |
          Identifies @ref WGPUInstanceExtras.
        value: 4
      - name: bind_group_entry_extras
        doc: |
          Identifies @ref WGPUBindGroupEntryExtras.
        value: 5
      - name: bind_group_layout_entry_extras
        doc: |
          Identifies @ref WGPUBindGroupLayoutEntryExtras.
        value: 6
      - name: query_set_descriptor_extras
        doc: |
          Identifies @ref WGPUQuerySetDescriptorExtras.
        value: 7
      - name: surface_configuration_extras
        doc: |
          Identifies @ref WGPUSurfaceConfigurationExtras.
        value: 8
      - name: surface_source_swap_chain_panel
        doc: |
          Identifies @ref WGPUSurfaceSourceSwapChainPanel.
        value: 9
      - name: primitive_state_extras
        doc: |
          Identifies @ref WGPUPrimitiveStateExtras.
        value: 10
      - name: sampler_descriptor_extras
        doc: |
          Identifies @ref WGPUSamplerDescriptorExtras.
        value: 11
  - name: surface_get_current_texture_status
    doc: |
      Additional surface-get-current-texture status codes defined by wgpu-native.

      These extend the standard `WGPUSurfaceGetCurrentTextureStatus` values.
    extended: true
    entries:
      - name: occluded
        doc: |
          The surface texture was not acquired because the window is occluded
          (e.g. minimized or fully covered by another window).

          No texture is returned and the `texture` field of
          `WGPUSurfaceTexture` will be NULL. The surface and swapchain remain
          valid -- there is no need to reconfigure or recreate the surface.

          Applications should skip rendering for the current frame and try
          again once the window is no longer occluded. If you are using a
          windowing library such as winit, listen for the window's "occluded"
          event and request a new redraw when the window becomes visible again.

          When does this occur?

          Currently this status is only produced by the Metal backend on macOS.
          When a window is not visible (checked via the `NSWindow`
          `occlusionState` property), acquiring the next drawable would block
          for up to one second waiting for vsync. wgpu-native returns
          `Occluded` instead to avoid that hang.

          Other backends (Vulkan, DX12, GL) do not currently report this
          status; an occluded window on those backends may produce
          `WGPUSurfaceGetCurrentTextureStatus_Timeout` or simply succeed
          normally.
        value: 1
  - name: native_feature
    doc: |
      Native-only device features.

      These extend the standard `WGPUFeatureName` values and can be passed to
      `WGPUDeviceDescriptor::requiredFeatures` to request additional
      capabilities when creating a device.
    entries:
      - name: immediates
        doc: |
          Allows the use of immediate data: small, fast blocks of memory
          that can be updated inside a render pass, compute pass, or render
          bundle encoder.

          Enables @ref wgpuRenderPassEncoderSetImmediates,
          @ref wgpuComputePassEncoderSetImmediates,
          @ref wgpuRenderBundleEncoderSetImmediates,
          non-zero `immediateSize` in @ref WGPUPipelineLayout,
          and non-zero `maxImmediateSize` in @ref WGPULimits.

          A block of immediate data can be declared in WGSL with
          `var<immediate>:`
          @code
          struct Immediates { example: f32, }
          var<immediate> c: Immediates;
          @endcode

          In GLSL, this corresponds to `layout`(immediates) `uniform` `Name` @c {..}.

          Supported platforms:
          - DX12
          - Vulkan
          - Metal
          - OpenGL (emulated with uniforms)
          - WebGPU

          This is a web and native feature.
        value: 1
      - name: texture_adapter_specific_format_features
        doc: |
          Enables device-specific texture format features.

          By default only texture format properties as defined by the WebGPU
          specification are allowed. Enabling this feature flag extends the
          features of each format to the ones supported by the current device.
          Note that without this flag, read/write storage access is not allowed
          at all.

          This extension does not enable additional formats.

          Supported platforms:
          - Vulkan
          - DX12
          - Metal

          This is a native only feature.
        value: 2
      - name: multi_draw_indirect_count
        doc: |
          Allows the use of a buffer containing the actual number of draw calls.

          Enables @ref wgpuRenderPassEncoderMultiDrawIndirectCount and
          @ref wgpuRenderPassEncoderMultiDrawIndexedIndirectCount.

          This feature being present also implies that all calls to
          @ref wgpuRenderPassEncoderMultiDrawIndirect and
          @ref wgpuRenderPassEncoderMultiDrawIndexedIndirect are not being
          emulated with a series of `draw_indirect` calls.

          Supported platforms:
          - DX12
          - Vulkan 1.2+ (or VK_KHR_draw_indirect_count)

          This is a native only feature.
        value: 4
      - name: vertex_writable_storage
        doc: |
          Enables bindings of writable storage buffers and textures visible
          to vertex shaders.

          Note: some (tiled-based) platforms do not support vertex shaders
          with any side-effects.

          Supported platforms:
          - All

          This is a native only feature.
        value: 5
      - name: texture_binding_array
        doc: |
          Allows the user to create uniform arrays of textures in shaders:

          - WGSL: `var` `textures:` `binding_array<texture_2d<f32>,` `10>`
          - GLSL: `uniform` `texture2D` `textures`[10]

          If @ref WGPUNativeFeature_StorageResourceBindingArray is supported
          as well as this, the user may also create uniform arrays of storage
          textures.

          This capability allows them to exist and to be indexed by dynamically
          uniform values.

          Supported platforms:
          - DX12
          - Metal (with MSL 2.0+ on macOS 10.13+)
          - Vulkan

          This is a native only feature.
        value: 6
      - name: sampled_texture_and_storage_buffer_array_non_uniform_indexing
        doc: |
          Allows shaders to index sampled texture and storage buffer resource
          arrays with dynamically non-uniform values:

          e.g. `texture_array`[vertex_data]

          In order to use this capability, the corresponding GLSL extension must
          be enabled:

          @c \#extension `GL_EXT_nonuniform_qualifier` `:` `require`

          and then used either as `nonuniformEXT` qualifier in variable
          declaration or as `nonuniformEXT` constructor.

          WGSL and HLSL do not need any extension.

          Supported platforms:
          - DX12
          - Metal (with MSL 2.0+ on macOS 10.13+)
          - Vulkan 1.2+ (or VK_EXT_descriptor_indexing)

          This is a native only feature.
        value: 7
      - name: pipeline_statistics_query
        doc: |
          Enables use of Pipeline Statistics Queries. These queries report the
          count of various operations performed between the start and stop call.

          Use @ref wgpuRenderPassEncoderBeginPipelineStatisticsQuery /
          @ref wgpuRenderPassEncoderEndPipelineStatisticsQuery (or the compute
          pass equivalents) to start and stop a query.

          They must be resolved using `wgpuCommandEncoderResolveQuerySet` into
          a buffer. See @ref WGPUPipelineStatisticName for the list of available
          statistics.

          Supported platforms:
          - Vulkan
          - DX12

          This is a native only feature.
        value: 8
      - name: storage_resource_binding_array
        doc: |
          Allows the user to create uniform arrays of storage buffers or
          textures in shaders, if @ref WGPUNativeFeature_BufferBindingArray
          or @ref WGPUNativeFeature_TextureBindingArray (respectively)
          is also supported.

          This capability allows them to exist and to be indexed by dynamically
          uniform values.

          Supported platforms:
          - Metal (with MSL 2.2+ on macOS 10.13+)
          - Vulkan

          This is a native only feature.
        value: 9
      - name: partially_bound_binding_array
        doc: |
          Allows the user to create bind groups containing arrays with fewer
          bindings than the `WGPUBindGroupLayout` requires.

          Supported platforms:
          - Vulkan
          - DX12

          This is a native only feature.
        value: 10
      - name: texture_format16bit_norm
        doc: |
          Enables normalized 16-bit texture formats:
          @ref WGPUTextureFormat_R16Unorm, @ref WGPUTextureFormat_R16Snorm,
          @ref WGPUTextureFormat_RG16Unorm, @ref WGPUTextureFormat_RG16Snorm,
          @ref WGPUTextureFormat_RGBA16Unorm, @ref WGPUTextureFormat_RGBA16Snorm.

          Supported platforms:
          - Vulkan
          - DX12
          - Metal

          This is a native only feature.
        value: 11
      - name: texture_compression_astc_hdr
        doc: |
          Enables ASTC HDR family of compressed textures.

          Compressed textures sacrifice some quality in exchange for
          significantly reduced bandwidth usage.

          Support for this feature guarantees availability of
          `COPY_SRC` | `COPY_DST` | `TEXTURE_BINDING` for ASTC formats
          with the HDR channel type.
          @ref WGPUNativeFeature_TextureAdapterSpecificFormatFeatures may
          enable additional usages.

          Supported platforms:
          - Metal
          - Vulkan
          - OpenGL

          This is a native only feature.
        value: 12
      - name: mappable_primary_buffers
        doc: |
          Removes the WebGPU restriction that `MAP_READ` and `MAP_WRITE`
          buffer usages must be paired exclusively with `COPY_DST` and
          `COPY_SRC` respectively.

          This is only beneficial on systems that share memory between CPU and
          GPU. If enabled on a system that doesn't, this can severely hinder
          performance. Only use if you understand the consequences.

          Supported platforms:
          - Vulkan
          - DX12
          - Metal

          This is a native only feature.
        value: 14
      - name: buffer_binding_array
        doc: |
          Allows the user to create arrays of buffers in shaders:

          - WGSL: `var<uniform>` `buffer_array:` `array<MyBuffer,` `10>`
          - GLSL: `uniform` `myBuffer` @c { @c ... @c } `buffer_array`[10]

          This capability allows them to exist and to be indexed by dynamically
          uniform values.

          If @ref WGPUNativeFeature_StorageResourceBindingArray is supported as
          well as this, the user may also create arrays of storage buffers.

          Supported platforms:
          - Vulkan

          This is a native only feature.
        value: 15
      - name: storage_texture_array_non_uniform_indexing
        doc: |
          Allows shaders to index storage texture resource
          arrays with dynamically non-uniform values.

          This is a native only feature.
        value: 16
      - name: address_mode_clamp_to_zero
        doc: |
          TODO
        value: 17
      - name: address_mode_clamp_to_border
        doc: |
          TODO
        value: 18
      - name: polygon_mode_line
        doc: |
          Allows the user to set @ref WGPUPolygonMode_Line in
          @ref WGPUPrimitiveStateExtras::polygonMode.

          This allows drawing polygons/triangles as lines (wireframe) instead
          of filled.

          Supported platforms:
          - DX12
          - Vulkan
          - Metal

          This is a native only feature.
        value: 19
      - name: polygon_mode_point
        doc: |
          Allows the user to set @ref WGPUPolygonMode_Point in
          @ref WGPUPrimitiveStateExtras::polygonMode.

          This allows only drawing the vertices of polygons/triangles instead
          of filled.

          Supported platforms:
          - Vulkan

          This is a native only feature.
        value: 20
      - name: conservative_rasterization
        doc: |
          Allows the user to enable overestimation conservative rasterization
          via @ref WGPUPrimitiveStateExtras::conservative.

          Processing of degenerate triangles/lines is hardware specific.
          Only triangles are supported.

          Supported platforms:
          - Vulkan

          This is a native only feature.
        value: 21
      - name: clear_texture
        doc: |
          Enables clear to zero for textures.

          Supported platforms:
          - All

          This is a native only feature.
        value: 22
      - name: multiview
        doc: |
          Enables multiview render passes and `builtin(view_index)` in vertex/mesh shaders.

          Supported platforms:
          - Vulkan
          - Metal
          - DX12
          - OpenGL (web only)

          This is a native only feature.
        value: 24
      - name: vertex_attribute64bit
        doc: |
          Enables using 64-bit types for vertex attributes.

          Requires @ref WGPUNativeFeature_ShaderF64.

          This is a native only feature.
        value: 25
      - name: texture_format_nv12
        doc: |
          Allows for creation of textures of format
          @ref WGPUNativeTextureFormat_NV12.

          Supported platforms:
          - DX12
          - Vulkan

          This is a native only feature.
        value: 26
      - name: ray_query
        doc: |
          Allows for the creation of ray-tracing queries within shaders.

          @b EXPERIMENTAL: Features enabled by this may have major bugs and are
          expected to be subject to breaking changes.

          Supported platforms:
          - Vulkan

          This is a native only feature.
        value: 28
      - name: shader_f64
        doc: |
          Enables 64-bit floating point types in SPIR-V shaders.

          Note: even when supported by GPU hardware, 64-bit floating point
          operations are frequently between 16 and 64 @e times slower than
          equivalent operations on 32-bit floats.

          Supported platforms:
          - Vulkan

          This is a native only feature.
        value: 29
      - name: shader_i16
        doc: |
          Allows shaders to use i16. Not currently supported in naga, only
          available through SPIR-V passthrough.

          Supported platforms:
          - Vulkan

          This is a native only feature.
        value: 30
      - name: shader_early_depth_test
        doc: |
          Allows shaders to use the `early_depth_test` attribute.

          The attribute is applied to the fragment shader entry point and can be
          used in two ways:

          1. Force early depth/stencil tests:
             - WGSL: @c \@early_depth_test(force)
             - GLSL: `layout`(early_fragment_tests) `in`;

          2. Provide a conservative depth specifier that allows an additional
             early depth test under certain conditions:
             - WGSL: @c \@early_depth_test(greater_equal/less_equal/unchanged)
             - GLSL: `layout`(depth_<greater/less/unchanged>) `out` `float` `gl_FragDepth`;

          Supported platforms:
          - Vulkan
          - GLES 3.1+

          This is a native only feature.
        value: 32
      - name: subgroup
        doc: |
          Allows compute and fragment shaders to use the subgroup operation
          built-ins and perform subgroup operations (except barriers).

          Supported platforms:
          - Vulkan
          - DX12
          - Metal

          This is a native only feature.
        value: 33
      - name: subgroup_vertex
        doc: |
          Allows vertex shaders to use the subgroup operation built-ins and
          perform subgroup operations (except barriers).

          Supported platforms:
          - Vulkan

          This is a native only feature.
        value: 34
      - name: subgroup_barrier
        doc: |
          Allows compute shaders to use the subgroup barrier.

          Requires @ref WGPUNativeFeature_Subgroup. Without it, enables nothing.

          Supported platforms:
          - Vulkan
          - Metal

          This is a native only feature.
        value: 35
      - name: timestamp_query_inside_encoders
        doc: |
          Allows for timestamp queries directly on command encoders.

          Implies `WGPUFeatureName_TimestampQuery` is supported.

          Supported platforms:
          - Vulkan
          - DX12
          - Metal
          - OpenGL (with GL_ARB_timer_query)

          This is a native only feature.
        value: 36
      - name: timestamp_query_inside_passes
        doc: |
          Allows for timestamp queries inside render and compute passes.

          Implies `WGPUFeatureName_TimestampQuery` and
          @ref WGPUNativeFeature_TimestampQueryInsideEncoders are supported.

          Enables @ref wgpuRenderPassEncoderWriteTimestamp and
          @ref wgpuComputePassEncoderWriteTimestamp.

          This is generally not available on tile-based rasterization GPUs.

          Supported platforms:
          - Vulkan
          - DX12
          - Metal (AMD & Intel, not Apple GPUs)
          - OpenGL (with GL_ARB_timer_query)

          This is a native only feature.
        value: 37
      - name: shader_int64
        doc: |
          Allows shaders to use i64 and u64.

          Supported platforms:
          - Vulkan
          - DX12 (DXC only)
          - Metal (with MSL 2.3+)

          This is a native only feature.
        value: 38
      - name: shader_float32_atomic
        doc: |
          Allows shaders to use f32 atomic load, store, add, sub, and exchange.

          Supported platforms:
          - Metal (with MSL 3.0+ and Apple7+/Mac2)
          - Vulkan (with [VK_EXT_shader_atomic_float])

          This is a native only feature.
        value: 39
      - name: texture_atomic
        doc: |
          Enables image atomic fetch add, and, xor, or, min, and max for R32Uint and R32Sint textures.

          Supported platforms:
          - Vulkan
          - DX12
          - Metal (with MSL 3.1+)

          This is a native only feature.
        value: 40
      - name: texture_format_p010
        doc: |
          Allows for creation of textures of format
          @ref WGPUNativeTextureFormat_P010.

          Supported platforms:
          - DX12
          - Vulkan

          This is a native only feature.
        value: 41
      - name: pipeline_cache
        doc: |
          Allows the use of pipeline cache objects

          Supported platforms:
          - Vulkan

          Unimplemented Platforms:
          - DX12
          - Metal
        value: 43
      - name: shader_int64_atomic_min_max
        doc: |
          Allows shaders to use i64 and u64 atomic min and max.

          Supported platforms:
          - Vulkan (with VK_KHR_shader_atomic_int64)
          - DX12 (with SM 6.6+)
          - Metal (with MSL 2.4+)

          This is a native only feature.
        value: 44
      - name: shader_int64_atomic_all_ops
        doc: |
          Allows shaders to use all i64 and u64 atomic operations.

          Supported platforms:
          - Vulkan (with VK_KHR_shader_atomic_int64)
          - DX12 (with SM 6.6+)

          This is a native only feature.
        value: 45
      - name: texture_int64_atomic
        doc: |
          Enables R64Uint image atomic min and max.

          Supported platforms:
          - Vulkan (with VK_EXT_shader_image_atomic_int64)
          - DX12 (with SM 6.6+)
          - Metal (with MSL 3.1+)

          This is a native only feature.
        value: 48
      - name: shader_barycentrics
        doc: |
          Enables shader barycentric coordinates.

          Supported platforms:
          - Vulkan (with VK_KHR_fragment_shader_barycentric)
          - DX12 (with SM 6.1+)
          - Metal (with MSL 2.2+)

          This is a native only feature.
        value: 55
      - name: selective_multiview
        doc: |
          Enables using multiview where not all texture array layers are rendered to in a single render pass/render pipeline. Making
          use of this feature also requires enabling `Features::MULTIVIEW`.

          Supported platforms
          - Vulkan
          - DX12

          While metal supports this in theory, the behavior of `view_index` differs from vulkan and dx12 so the feature isn't exposed.
        value: 56
      - name: multisample_array
        doc: |
          TODO
        value: 58
      - name: cooperative_matrix
        doc: |
          Enables cooperative matrix operations (also known as tensor cores on NVIDIA GPUs
          or simdgroup matrix operations on Apple GPUs).

          Cooperative matrices allow a workgroup to collectively load, store, and perform
          matrix multiply-accumulate operations on small tiles of data, enabling
          hardware-accelerated matrix math.

          @b EXPERIMENTAL: Features enabled by this may have major bugs and are
          expected to be subject to breaking changes.

          **Current limitations:** The implementation currently only supports 8x8 f32 matrices.
          On Vulkan, support is determined by querying `vkGetPhysicalDeviceCooperativeMatrixPropertiesKHR`
          for configurations matching 8x8x8 f32. Most Vulkan implementations (NVIDIA, AMD) primarily
          support f16 inputs at larger sizes (e.g., 16x16), so Vulkan support may be limited.

          Supported platforms:
          - Metal (with MSL 2.3+ and Apple7+/Mac2+, using simdgroup matrix operations)
          - Vulkan (with [VK_KHR_cooperative_matrix](https://registry.khronos.org/vulkan/specs/latest/man/html/VK_KHR_cooperative_matrix.html), if 8x8 f32 is supported)

          This is a native only feature.
        value: 59
      - name: shader_per_vertex
        doc: |
          Enables shader per-vertex attributes.

          Supported platforms:
          - Vulkan (with VK_KHR_fragment_shader_barycentric)

          This is a native only feature.
        value: 60
      - name: shader_draw_index
        doc: |
          Enables shader `draw_index` builtin.

          Supported platforms:
          - GLES
          - Vulkan

          Potential platforms:
          - DX12
          - Metal

          This is a native only feature.
        value: 61
      - name: acceleration_structure_binding_array
        doc: |
          Allows the user to create arrays of acceleration structures in shaders:

          ex.
          - `var tlas: binding_array<acceleration_structure, 10>` (WGSL)

          This capability allows them to exist and to be indexed by dynamically uniform values.

          Supported platforms:
          - DX12
          - Vulkan

          This is a native only feature.
        value: 62
      - name: memory_decoration_coherent
        doc: |
          Enables the `@coherent` memory decoration on storage buffer variables.

          Backend mapping:
          - Vulkan
          - DX12
          - Metal (3.2+)
          - GLES (ES 3.1+ / GL 4.3+)

          This is a native only feature.
        value: 63
      - name: memory_decoration_volatile
        doc: |
          Enables the `@volatile` memory decoration on storage buffer variables.

          Backend mapping:
          - Vulkan
          - GLES (ES 3.1+ / GL 4.3+)

          This is a native only feature.
        value: 64
