name: codebrix
enum_prefix: 0x000C
doc: |
  CodeBrix extensions to the wgpu-native C API.

  This file is the ONLY contract for the functions the codebrix_wgpu native library exports beyond
  webgpu.h (webgpu.yml) and wgpu.h (specs/wgpu.yml). It is written in the webgpu-headers YAML schema
  (wgpu-native/ffi/webgpu-headers/schema.json) so that ONE generator renders the C header, the Rust
  export table and the C# binding for all three specifications. C names follow the same rule as the
  other two files: `wgpu` + PascalCase(name), so `codebrix_get_api_version` is `wgpuCodebrixGetApiVersion`.

  Why these functions exist: CodeBrix.WebGpu.Skia shares ONE GPU device between wgpu and a SkiaSharp
  GRContext so that wgpu can render straight into the texture an SKSurface owns (zero copy). wgpu-native
  only exposes the Metal objects behind a device/queue/texture (wgpuDeviceGetNativeMetalDevice,
  wgpuQueueGetNativeMetalCommandQueue, wgpuTextureGetNativeMetalTexture); the Vulkan and Direct3D 12
  equivalents, the reverse direction (wrapping an application's existing device or texture as wgpu
  objects) and an explicit texture state transition are added here. They are implemented over
  wgpu-core's `*_as_hal` / `create_*_from_hal` APIs and wgpu-hal's `raw_*` / `*_from_raw` accessors.

  Platform rule: every function below is EXPORTED ON EVERY RUNTIME IDENTIFIER, so the export set is
  identical on all nine. A function for a backend the platform does not have (Vulkan on macOS, Direct3D
  12 anywhere but Windows, Metal anywhere but macOS) returns `WGPUStatus_Error` and sets no output;
  a getter called on a device that is on a different backend does the same. Use
  `codebrix_device_get_backend` first.

  Versioning: `codebrix_get_api_version` returns CODEBRIX_API_VERSION (the `api_version` constant
  below). The managed side refuses a library whose value differs. Bump it whenever a function, struct
  or enum here changes shape or meaning. Adding a function also changes the export set, which means
  all nine natives must be rebuilt before the next publish. The out-param structs below carry no size
  or version field of their own: their layout is the one of this contract version.

  Capability evidence: an exported symbol only proves the function can be called, not that it works.
  @ref wgpuCodebrixGetProcStatus reports, per function-table ordinal, what the LOADED library knows
  about each function (implemented, ends the process when called, ends the process on bad input,
  always fails, or needs a backend this build lacks); @ref WGPUCodebrixBuildInfo `patches` names the
  native fix set; @ref wgpuCodebrixAdapterGetDownlevelCapabilities and
  @ref wgpuCodebrixAdapterGetTextureFormatFeatures answer what the adapter can do beyond
  `wgpuAdapterGetFeatures` / `wgpuAdapterGetLimits`.

  Threading: the same rules as the wgpu-native objects the functions take.

constants:
  - name: api_version
    value: 4
    doc: |
      The version of this contract. Returned by @ref wgpuCodebrixGetApiVersion.

typedefs: []

enums:
  - name: codebrix_texture_state
    doc: |
      The state (Vulkan: image layout + access; Direct3D 12: resource state) a texture is in or is to
      be transitioned to. These are wgpu-core's internal texture uses, named for the foreign-API owner
      that needs to know them. Used by @ref wgpuCodebrixCommandEncoderTransitionTexture and as the
      `initialState` of every `CreateTextureFrom*` function.
    entries:
      - name: undefined
        doc: |
          Unknown / uninitialised. Vulkan `VK_IMAGE_LAYOUT_UNDEFINED`. Only valid as an initial state.
      - name: copy_src
        doc: |
          Source of a copy. Vulkan `TRANSFER_SRC_OPTIMAL`; D3D12 `COPY_SOURCE`.
      - name: copy_dst
        doc: |
          Destination of a copy. Vulkan `TRANSFER_DST_OPTIMAL`; D3D12 `COPY_DEST`.
      - name: shader_resource
        doc: |
          Sampled / read in a shader. Vulkan `SHADER_READ_ONLY_OPTIMAL`; D3D12 `PIXEL_SHADER_RESOURCE | NON_PIXEL_SHADER_RESOURCE`.
      - name: storage_read_write
        doc: |
          Storage texture, read and write. Vulkan `GENERAL`; D3D12 `UNORDERED_ACCESS`.
      - name: color_target
        doc: |
          Render pass colour attachment. Vulkan `COLOR_ATTACHMENT_OPTIMAL`; D3D12 `RENDER_TARGET`.
          This is the state a SkiaSharp GRContext expects a render target in when it takes over drawing.
      - name: depth_stencil_read
        doc: |
          Depth/stencil attachment, read only. Vulkan `DEPTH_STENCIL_READ_ONLY_OPTIMAL`; D3D12 `DEPTH_READ`.
      - name: depth_stencil_write
        doc: |
          Depth/stencil attachment, writable. Vulkan `DEPTH_STENCIL_ATTACHMENT_OPTIMAL`; D3D12 `DEPTH_WRITE`.
      - name: present
        doc: |
          Ready to present. Vulkan `PRESENT_SRC_KHR`; D3D12 `PRESENT`.

  - name: codebrix_proc_status
    doc: |
      What the loaded library knows about one exported function, by its ordinal in the function table
      (`WGPUCodebrixProcTable`, include/codebrix_wgpu_procs.h). Returned by
      @ref wgpuCodebrixGetProcStatus. The static part comes from specs/proc-table-notes.txt (the same
      notes the table's comments carry); `not_available_on_backend` is decided by the library itself
      from the backends it was compiled with.
    entries:
      - name: unknown
        doc: |
          The ordinal is outside the function table.
      - name: implemented
        doc: |
          Implemented; no recorded abort path. Functions for one backend (their name contains Vulkan,
          D3d12 or Metal) still return `WGPUStatus_Error` / NULL for a device on another backend.
      - name: aborts_unimplemented
        doc: |
          Not implemented by the engine: calling it ENDS THE PROCESS. Never call it.
      - name: aborts_on_error
        doc: |
          Implemented, but ENDS THE PROCESS on the inputs or states its note names (see the table's
          comment); guard those inputs.
      - name: unsupported
        doc: |
          Exported and safe to call, but always fails (returns `WGPUStatus_Error` / NULL) with this engine.
      - name: not_available_on_backend
        doc: |
          Needs a backend this library was not built with (Vulkan, Direct3D 12 or Metal); every call
          returns `WGPUStatus_Error` / NULL.

  - name: codebrix_poll_result
    doc: |
      The outcome of @ref wgpuCodebrixDevicePoll.
    entries:
      - name: queue_empty
        doc: |
          No submission was in flight when the poll ended (every callback of finished work has run).
      - name: wait_succeeded
        doc: |
          The waited-for submission finished within the timeout; later submissions may still be in flight.
      - name: poll
        doc: |
          A non-blocking poll (`wait` false) ran; submissions are still in flight.
      - name: timeout
        doc: |
          The wait reached `timeoutNs` before the submission finished. Nothing is lost; poll again.
      - name: device_lost
        doc: |
          The device is lost (driver or hardware failure). Release the device and create a new one.
      - name: invalid_submission_index
        doc: |
          `submissionIndex` is not an index a successful @ref wgpuQueueSubmitForIndex on THIS device
          returned (a foreign or future index). The device is unaffected.
      - name: error
        doc: |
          Any other failure (out of memory, an invalid argument); the message goes to the log callback.

  - name: codebrix_shader_model
    doc: |
      Which collection of shader features the adapter supports, in Direct3D shader-model terms
      (wgpu-types `ShaderModel`). Part of @ref WGPUCodebrixDownlevelCapabilities.
    entries:
      - name: sm2
        doc: |
          Extremely limited shaders, including a total instruction limit.
      - name: sm4
        doc: |
          Missing minor features and storage images.
      - name: sm5
        doc: |
          Everything WebGPU requires.

  - name: s_type
    doc: |
      Struct type identifiers (@ref WGPUSType values) of the CodeBrix extension structs, in the
      `0x000CXXXX` block of this file.
    extended: true
    entries:
      - name: codebrix_pipeline_descriptor_extras
        doc: |
          Identifies @ref WGPUCodebrixPipelineDescriptorExtras.
        value: 1

bitflags:
  - name: codebrix_downlevel_flags
    doc: |
      Capabilities an adapter may lack compared with the WebGPU baseline (wgpu-types `DownlevelFlags`,
      the same bit values). A WebGPU-compliant adapter (Vulkan, Metal, Direct3D 12 on capable hardware)
      has all of them; GL ES adapters miss several. Part of @ref WGPUCodebrixDownlevelCapabilities.
    entries:
      - name: none
        doc: |
          No flags.
        value: 0
      - name: compute_shaders
        doc: |
          Compute shaders can be compiled and dispatched.
        value: 1
      - name: fragment_writable_storage
        doc: |
          Storage buffers and textures can be written from fragment shaders.
        value: 2
      - name: indirect_execution
        doc: |
          Indirect draws and dispatches.
        value: 4
      - name: base_vertex
        doc: |
          A non-zero `baseVertex` in direct indexed draws.
        value: 8
      - name: read_only_depth_stencil
        doc: |
          Sampling a depth/stencil texture while it is a read-only depth/stencil attachment.
        value: 16
      - name: non_power_of_two_mipmapped_textures
        doc: |
          Mipmapped textures whose size is not a power of two.
        value: 32
      - name: cube_array_textures
        doc: |
          Cube-array textures.
        value: 64
      - name: comparison_samplers
        doc: |
          Comparison samplers.
        value: 128
      - name: independent_blend
        doc: |
          A different blend state per colour attachment.
        value: 256
      - name: vertex_storage
        doc: |
          Storage buffers in vertex shaders.
        value: 512
      - name: anisotropic_filtering
        doc: |
          Anisotropic sampler filtering.
        value: 1024
      - name: fragment_storage
        doc: |
          Storage buffers in fragment shaders.
        value: 2048
      - name: multisampled_shading
        doc: |
          Sample-rate shading.
        value: 4096
      - name: depth_texture_and_buffer_copies
        doc: |
          Copies between depth textures and buffers.
        value: 8192
      - name: webgpu_texture_format_support
        doc: |
          Every texture usage WebGPU describes for every format; without it, ask
          @ref wgpuCodebrixAdapterGetTextureFormatFeatures per format.
        value: 16384
      - name: buffer_bindings_not_16_byte_aligned
        doc: |
          Buffer bindings whose size is not a multiple of 16.
        value: 32768
      - name: unrestricted_index_buffer
        doc: |
          Index buffers combined with usages other than copies.
        value: 65536
      - name: full_draw_index_uint32
        doc: |
          The full 32-bit index range (otherwise 2^24-1).
        value: 131072
      - name: depth_bias_clamp
        doc: |
          Depth bias clamping.
        value: 262144
      - name: view_formats
        doc: |
          `viewFormats` on texture creation.
        value: 524288
      - name: unrestricted_external_texture_copies
        doc: |
          Unrestricted external-image copies.
        value: 1048576
      - name: surface_view_formats
        doc: |
          `viewFormats` on surface textures.
        value: 2097152
      - name: nonblocking_query_resolve
        doc: |
          Query resolves run on the queue timeline (otherwise they block the device timeline).
        value: 4194304
      - name: shader_f16_in_f32
        doc: |
          `quantizeToF16`, `pack2x16float` and `unpack2x16float` in shaders.
        value: 8388608

  - name: codebrix_texture_format_feature_flags
    doc: |
      Per-format capabilities of an adapter beyond its allowed usages (wgpu-types
      `TextureFormatFeatureFlags`, the same bit values). Part of @ref WGPUCodebrixTextureFormatFeatures.
    entries:
      - name: none
        doc: |
          No flags.
        value: 0
      - name: filterable
        doc: |
          Can be sampled with a filtering sampler.
        value: 1
      - name: multisample_x2
        doc: |
          `sampleCount` 2.
        value: 2
      - name: multisample_x4
        doc: |
          `sampleCount` 4.
        value: 4
      - name: multisample_x8
        doc: |
          `sampleCount` 8.
        value: 8
      - name: multisample_x16
        doc: |
          `sampleCount` 16.
        value: 16
      - name: multisample_resolve
        doc: |
          Can be the resolve target of a multisampled render pass.
        value: 32
      - name: storage_read_only
        doc: |
          Can be bound as a read-only storage texture.
        value: 64
      - name: storage_write_only
        doc: |
          Can be bound as a write-only storage texture.
        value: 128
      - name: storage_read_write
        doc: |
          Can be bound as a read-write storage texture.
        value: 256
      - name: storage_atomic
        doc: |
          Can be bound as a storage texture with atomic access.
        value: 512
      - name: blendable
        doc: |
          Can be blended into as a render target.
        value: 1024

structs:
  - name: codebrix_name
    doc: |
      One name in a list of names (a Vulkan extension name). A single-member struct so that
      `array<struct.codebrix_name>` renders as the standard count + pointer pair; its layout is exactly
      one @ref WGPUStringView.
    type: standalone
    members:
      - name: name
        doc: |
          The name, as a string view.
        type: string_with_default_empty

  - name: codebrix_build_info
    doc: |
      What this native library was built from. Every string is static and valid for the life of the
      process; never free them. Filled by @ref wgpuCodebrixGetBuildInfo.
    type: standalone
    members:
      - name: api_version
        doc: |
          Same value as @ref wgpuCodebrixGetApiVersion.
        type: uint32
      - name: wgpu_native_version
        doc: |
          The wgpu-native release this library wraps, as a dotted string (e.g. "29.0.1.1").
        type: out_string
      - name: wgpu_core_version
        doc: |
          The wgpu-core crate version compiled in (e.g. "29.0.3").
        type: out_string
      - name: backends
        doc: |
          Comma-separated backend feature names compiled in, in wgpu-native's feature spelling
          (e.g. "vulkan,gles" on Linux, "dx12,vulkan,gles" on Windows, "metal" on macOS).
        type: out_string
      - name: target_triple
        doc: |
          The Rust target triple the library was built for (e.g. "x86_64-unknown-linux-gnu").
        type: out_string
      - name: profile
        doc: |
          The cargo profile ("release").
        type: out_string
      - name: patches
        doc: |
          The native fix set: comma-separated names (file names without `.patch`, in apply order) of
          the wgpu-native-tools/patches this library was built with, e.g.
          "0001-wgpu-native-crate-type-rlib,0002-wgpu-native-codebrix-bridge-module". Two libraries
          with the same contract version and function-table hash but different `patches` behave
          differently; compare this string, never the export set, to tell a fixed native from an old one.
        type: out_string

  - name: codebrix_vulkan_device_info
    doc: |
      The Vulkan objects behind a wgpu device. All handles are the raw `VkInstance`, `VkPhysicalDevice`,
      `VkDevice` and `VkQueue` values; they stay owned by wgpu and are valid while the device is alive.
      Exactly what SkiaSharp's `GRVkBackendContext` needs to create a `GRContext` on the same device.
      Filled by @ref wgpuCodebrixDeviceGetVulkanInfo.
    type: standalone
    members:
      - name: instance
        doc: |
          `VkInstance`.
        type: c_void
        pointer: mutable
      - name: physical_device
        doc: |
          `VkPhysicalDevice`.
        type: c_void
        pointer: mutable
      - name: device
        doc: |
          `VkDevice`.
        type: c_void
        pointer: mutable
      - name: queue
        doc: |
          `VkQueue` - the queue wgpu submits to.
        type: c_void
        pointer: mutable
      - name: queue_family_index
        doc: |
          The family index of `queue`.
        type: uint32
      - name: queue_index
        doc: |
          The index of `queue` within its family.
        type: uint32
      - name: instance_api_version
        doc: |
          The `VkApplicationInfo::apiVersion` the instance was created with (`VK_MAKE_API_VERSION`
          packed). For an instance wgpu created this is wgpu-hal's rule: 1.0 when the Vulkan loader
          reports less than 1.1 (`vkEnumerateInstanceVersion`), otherwise exactly 1.3 (wgpu-hal's maximum)
          - so a 1.4 loader still gives 1.3, and no 1.4 entry point is loaded. For an adopted device it is
          the `instance_api_version` of its @ref WGPUCodebrixVulkanAdoptDescriptor. This is the value
          Skia's `MaxAPIVersion` and another adopt descriptor expect. (Vulkan's own rule still applies on
          top: device-level functionality is limited to the lower of this and the physical device's
          `apiVersion`.)
        type: uint32
      - name: get_instance_proc_addr
        doc: |
          The `vkGetInstanceProcAddr` entry point wgpu loaded Vulkan through, as a plain function
          pointer. SkiaSharp's `GRVkGetProcedureAddressDelegate` can be built over it.
        type: c_void
        pointer: mutable
      - name: enabled_instance_extensions
        doc: |
          The instance extension names wgpu enabled. Static strings; valid for the life of the device.
        type: array<struct.codebrix_name>
        pointer: immutable
      - name: enabled_device_extensions
        doc: |
          The device extension names wgpu enabled. Static strings; valid for the life of the device.
        type: array<struct.codebrix_name>
        pointer: immutable

  - name: codebrix_vulkan_texture_info
    doc: |
      The Vulkan image behind a wgpu texture. Filled by @ref wgpuCodebrixTextureGetVulkanInfo.
    type: standalone
    members:
      - name: image
        doc: |
          `VkImage`. Owned by wgpu; valid while the texture is alive.
        type: c_void
        pointer: mutable
      - name: format
        doc: |
          The `VkFormat` value of the image.
        type: uint32
      - name: sample_count
        doc: |
          `VkSampleCountFlagBits` of the image.
        type: uint32

  - name: codebrix_d3d12_device_info
    doc: |
      The Direct3D 12 objects behind a wgpu device. COM pointers; they stay owned by wgpu and are valid
      while the device is alive (take your own reference if you keep them). Exactly what SkiaSharp's
      `GRD3DBackendContext` needs. Filled by @ref wgpuCodebrixDeviceGetD3d12Info.
    type: standalone
    members:
      - name: adapter
        doc: |
          `IDXGIAdapter*`.
        type: c_void
        pointer: mutable
      - name: device
        doc: |
          `ID3D12Device*`.
        type: c_void
        pointer: mutable
      - name: queue
        doc: |
          `ID3D12CommandQueue*` - the queue wgpu submits to.
        type: c_void
        pointer: mutable

  - name: codebrix_d3d12_texture_info
    doc: |
      The Direct3D 12 resource behind a wgpu texture. Filled by @ref wgpuCodebrixTextureGetD3d12Info.
    type: standalone
    members:
      - name: resource
        doc: |
          `ID3D12Resource*`. Owned by wgpu; valid while the texture is alive.
        type: c_void
        pointer: mutable
      - name: format
        doc: |
          The `DXGI_FORMAT` value of the resource.
        type: uint32
      - name: sample_count
        doc: |
          Samples per pixel.
        type: uint32

  - name: codebrix_vulkan_adopt_descriptor
    doc: |
      An application-owned Vulkan device to wrap as a wgpu adapter + device, for
      @ref wgpuCodebrixInstanceAdoptVulkanDevice. The application keeps ownership of every object and
      must keep them alive until the wgpu device is released. wgpu requires the device to have been
      created with the extensions and features it would have asked for itself (wgpu-hal's
      `required_device_extensions` / `physical_device_features` for the requested feature set); the
      function fails with `WGPUStatus_Error` and a message through the instance's log callback when
      something required is missing.
    type: standalone
    members:
      - name: instance
        doc: |
          `VkInstance`.
        type: c_void
        pointer: mutable
      - name: physical_device
        doc: |
          `VkPhysicalDevice`.
        type: c_void
        pointer: mutable
      - name: device
        doc: |
          `VkDevice`.
        type: c_void
        pointer: mutable
      - name: queue_family_index
        doc: |
          The family index of the graphics+compute queue wgpu is to submit to.
        type: uint32
      - name: queue_index
        doc: |
          The queue index within that family.
        type: uint32
      - name: instance_api_version
        doc: |
          The Vulkan API version the application created the instance with (`VkApplicationInfo::apiVersion`,
          `VK_MAKE_API_VERSION` packed); wgpu uses no instance-level functionality above it. When the
          instance came from wgpu, the `instance_api_version` of @ref WGPUCodebrixVulkanDeviceInfo is that
          value. The version the Vulkan loader reports (`vkEnumerateInstanceVersion`) may be higher than
          the instance's and is only a best-effort fallback when the real value is unknown.
        type: uint32
      - name: get_instance_proc_addr
        doc: |
          `vkGetInstanceProcAddr`, as a plain function pointer. wgpu loads every other entry point
          through it; it never loads the Vulkan loader itself for an adopted device.
        type: c_void
        pointer: mutable
      - name: enabled_instance_extensions
        doc: |
          The instance extensions the instance was created with.
        type: array<struct.codebrix_name>
        pointer: immutable
      - name: enabled_device_extensions
        doc: |
          The device extensions the device was created with.
        type: array<struct.codebrix_name>
        pointer: immutable
      - name: required_features
        doc: |
          The wgpu features the adopted device must expose (`WGPUFeatureName` values). May be empty.
        type: array<enum.feature_name>
        pointer: immutable

  - name: codebrix_d3d12_adopt_descriptor
    doc: |
      An application-owned Direct3D 12 device to wrap as a wgpu adapter + device, for
      @ref wgpuCodebrixInstanceAdoptD3d12Device. The application keeps ownership; wgpu adds its own COM
      references.
    type: standalone
    members:
      - name: adapter
        doc: |
          `IDXGIAdapter*` the device was created on.
        type: c_void
        pointer: mutable
      - name: device
        doc: |
          `ID3D12Device*`.
        type: c_void
        pointer: mutable
      - name: queue
        doc: |
          `ID3D12CommandQueue*` (a DIRECT queue) wgpu is to submit to.
        type: c_void
        pointer: mutable
      - name: required_features
        doc: |
          The wgpu features the adopted device must expose. May be empty.
        type: array<enum.feature_name>
        pointer: immutable

  - name: codebrix_metal_adopt_descriptor
    doc: |
      An application-owned Metal device to wrap as a wgpu adapter + device, for
      @ref wgpuCodebrixInstanceAdoptMetalDevice. The application keeps ownership; wgpu retains what it
      uses.
    type: standalone
    members:
      - name: device
        doc: |
          `id<MTLDevice>`.
        type: c_void
        pointer: mutable
      - name: required_features
        doc: |
          The wgpu features the adopted device must expose. May be empty.
        type: array<enum.feature_name>
        pointer: immutable

  - name: codebrix_downlevel_capabilities
    doc: |
      What an adapter can do compared with the WebGPU baseline (wgpu-core
      `adapter_downlevel_capabilities`). The WebGPU features and limits are NOT repeated here: use
      `wgpuAdapterGetFeatures`, `wgpuAdapterHasFeature` and `wgpuAdapterGetLimits` for those. (wgpu's
      `DownlevelLimits` has no members in this engine, so there are none here.) Filled by
      @ref wgpuCodebrixAdapterGetDownlevelCapabilities.
    type: standalone
    members:
      - name: flags
        doc: |
          The downlevel capabilities the adapter has.
        type: bitflag.codebrix_downlevel_flags
      - name: shader_model
        doc: |
          The shader model the adapter supports.
        type: enum.codebrix_shader_model
      - name: webgpu_compliant
        doc: |
          True when the adapter offers the complete WebGPU baseline (every compliant flag and `sm5`).
        type: bool

  - name: codebrix_texture_format_features
    doc: |
      What an adapter allows for one texture format (wgpu-core `adapter_get_texture_format_features`).
      With @ref WGPUNativeFeature_TextureAdapterSpecificFormatFeatures enabled on a device these are the
      capabilities that device honours; without it the device keeps to the WebGPU rules for the format.
      Filled by @ref wgpuCodebrixAdapterGetTextureFormatFeatures.
    type: standalone
    members:
      - name: allowed_usages
        doc: |
          The texture usages the format may be created with.
        type: bitflag.texture_usage
      - name: flags
        doc: |
          Filterability, multisample counts, storage access modes and blendability.
        type: bitflag.codebrix_texture_format_feature_flags

  - name: codebrix_vulkan_adopt_requirements
    doc: |
      What an application must create its `VkDevice` with so that
      @ref wgpuCodebrixInstanceAdoptVulkanDevice accepts it: the device extensions wgpu-hal's
      `required_device_extensions` returns for the adapter and feature set, and the feature structures
      wgpu-hal's `physical_device_features` would enable. Filled by
      @ref wgpuCodebrixVulkanGetAdoptRequirements; release with
      @ref wgpuCodebrixVulkanAdoptRequirementsFreeMembers.
    type: standalone
    free_members: true
    members:
      - name: required_device_extensions
        doc: |
          Enable every one of these device extensions (you may enable more). Static strings, valid for
          the life of the process (FreeMembers does not free them).
        type: array<struct.codebrix_name>
        pointer: immutable
      - name: physical_device_features2
        doc: |
          A `VkPhysicalDeviceFeatures2*` with its `pNext` chain of the feature structures wgpu enables,
          OWNED by the library until FreeMembers. Put it into `VkDeviceCreateInfo::pNext` (with
          `pEnabledFeatures` NULL), or copy it and OR in features of your own - never enable fewer. To
          chain structures of your own, put them in front of it; never write into it.
        type: c_void
        pointer: mutable
      - name: physical_device_api_version
        doc: |
          The physical device's `VkPhysicalDeviceProperties::apiVersion`.
        type: uint32

  - name: codebrix_fault_callbacks
    doc: |
      One fault listener for @ref wgpuCodebrixDeviceAddFaultListener: the standard webgpu.h callback
      types, each with its own two userdata pointers. Either callback may be NULL. `nextInChain` and the
      device-lost `mode` are ignored: listeners always run spontaneously, on the thread that discovers
      the fault, while the device's error sink is locked - keep them small and NEVER call webgpu.h
      functions on that device (or add/remove listeners) from inside them; defer GPU work.
    type: standalone
    members:
      - name: uncaptured_error_callback_info
        doc: |
          Called for every error no error scope captures, AFTER the device's own uncaptured-error
          callback.
        type: callback.uncaptured_error
      - name: device_lost_callback_info
        doc: |
          Called when the device's own device-lost callback is called, AFTER it, and once when
          @ref wgpuCodebrixDevicePoll first observes the device lost.
        type: callback.device_lost

  - name: codebrix_pipeline_cache_descriptor
    doc: |
      Describes a @ref WGPUCodebrixPipelineCache for @ref wgpuCodebrixDeviceCreatePipelineCache. The
      shape of wgpu-native's (unmerged) upstream pipeline-cache proposal, gfx-rs/wgpu-native PR #618,
      under CodeBrix names.
    type: extensible
    members:
      - name: label
        doc: |
          A debug label.
        type: string_with_default_empty
      - name: data
        doc: |
          The bytes to start the cache from: what an earlier @ref wgpuCodebrixPipelineCacheGetData
          returned. NULL (or `dataSize` 0) starts an empty cache. Cache data is specific to the
          adapter, driver version and wgpu version that produced it: wgpu-core checks the header it puts
          in front of the driver's data (and the driver checks its own). Data made on a DIFFERENT
          adapter (another GPU or backend) is always a validation error, whatever `fallback` says - so
          keep one cache per @ref wgpuCodebrixAdapterGetPipelineCacheKey. The bytes are copied during
          the call.
        type: c_void
        pointer: immutable
        optional: true
      - name: data_size
        doc: |
          The number of bytes at `data`.
        type: usize
      - name: fallback
        doc: |
          True (recommended): data that is truncated, corrupt, outdated (made before a driver or wgpu
          update) or from a newer wgpu gives an EMPTY cache instead of an error. False: such data is a
          validation error and the cache is invalid. Data from another adapter is an error either way.
        type: bool

  - name: codebrix_pipeline_descriptor_extras
    doc: |
      Chained onto a @ref WGPURenderPipelineDescriptor or @ref WGPUComputePipelineDescriptor (sType
      @ref WGPUSType_CodebrixPipelineDescriptorExtras) to compile the pipeline through a pipeline cache:
      the driver reuses what the cache already holds for the pipeline's shaders and adds what it
      compiles. One struct for both descriptor types, as in gfx-rs/wgpu-native PR #618.
    type: extension
    extends:
      - render_pipeline_descriptor
      - compute_pipeline_descriptor
    members:
      - name: pipeline_cache
        doc: |
          The cache, created on the same device; NULL compiles without one (as if the struct were not
          chained). An INVALID cache (one whose creation reported an error) makes the pipeline creation
          a validation error.
        type: object.codebrix_pipeline_cache
        optional: true

callbacks: []

functions:
  - name: codebrix_get_api_version
    doc: |
      Returns the `api_version` constant this library was built from. Call it before anything else and
      refuse the library if it is not the value this binding was generated from.
    returns:
      doc: |
        CODEBRIX_API_VERSION.
      type: uint32

  - name: codebrix_get_build_info
    doc: |
      Fills @ref WGPUCodebrixBuildInfo. Never fails.
    args:
      - name: info
        doc: |
          Receives the build information.
        type: struct.codebrix_build_info
        pointer: mutable

  - name: codebrix_get_struct_layout
    doc: |
      Reports the native `sizeof` and `alignof` of a struct declared in webgpu.yml, wgpu.yml or this
      file, by its C type name (e.g. "WGPUTextureDescriptor"). The managed binding checks every
      generated struct against this at load time; a mismatch means the binding and the native disagree
      and nothing else may be called.
    returns:
      doc: |
        `WGPUStatus_Success`, or `WGPUStatus_Error` when the name is unknown.
      type: enum.status
    args:
      - name: struct_name
        doc: |
          The C type name.
        type: string_with_default_empty
      - name: size
        doc: |
          Receives `sizeof`.
        type: usize
        pointer: mutable
      - name: alignment
        doc: |
          Receives `alignof`.
        type: usize
        pointer: mutable

  - name: codebrix_device_get_backend
    doc: |
      The backend the device runs on. The same value `wgpuAdapterGetInfo` reports for the device's
      adapter, without needing the adapter.
    returns:
      doc: |
        The backend, or `WGPUBackendType_Undefined` for a null device.
      type: enum.backend_type
    args:
      - name: device
        doc: |
          The device.
        type: object.device

  - name: codebrix_device_get_vulkan_info
    doc: |
      Fills @ref WGPUCodebrixVulkanDeviceInfo for a device on the Vulkan backend.
    returns:
      doc: |
        `WGPUStatus_Success`, or `WGPUStatus_Error` when the device is not on Vulkan or the library has
        no Vulkan backend.
      type: enum.status
    args:
      - name: device
        doc: |
          The device.
        type: object.device
      - name: info
        doc: |
          Receives the Vulkan objects.
        type: struct.codebrix_vulkan_device_info
        pointer: mutable

  - name: codebrix_texture_get_vulkan_info
    doc: |
      Fills @ref WGPUCodebrixVulkanTextureInfo for a texture on the Vulkan backend.
    returns:
      doc: |
        `WGPUStatus_Success` or `WGPUStatus_Error`.
      type: enum.status
    args:
      - name: texture
        doc: |
          The texture.
        type: object.texture
      - name: info
        doc: |
          Receives the Vulkan image.
        type: struct.codebrix_vulkan_texture_info
        pointer: mutable

  - name: codebrix_device_get_d3d12_info
    doc: |
      Fills @ref WGPUCodebrixD3d12DeviceInfo for a device on the Direct3D 12 backend.
    returns:
      doc: |
        `WGPUStatus_Success`, or `WGPUStatus_Error` when the device is not on Direct3D 12 or the library
        has no Direct3D 12 backend.
      type: enum.status
    args:
      - name: device
        doc: |
          The device.
        type: object.device
      - name: info
        doc: |
          Receives the Direct3D 12 objects.
        type: struct.codebrix_d3d12_device_info
        pointer: mutable

  - name: codebrix_texture_get_d3d12_info
    doc: |
      Fills @ref WGPUCodebrixD3d12TextureInfo for a texture on the Direct3D 12 backend.
    returns:
      doc: |
        `WGPUStatus_Success` or `WGPUStatus_Error`.
      type: enum.status
    args:
      - name: texture
        doc: |
          The texture.
        type: object.texture
      - name: info
        doc: |
          Receives the Direct3D 12 resource.
        type: struct.codebrix_d3d12_texture_info
        pointer: mutable

  - name: codebrix_device_create_texture_from_vulkan_image
    doc: |
      Wraps an application-owned `VkImage` as a wgpu texture (wgpu-hal `texture_from_raw`). The
      descriptor must describe the image exactly (size, format, mip levels, array layers, samples,
      usage); the image stays owned by the application and must outlive the returned texture. The
      texture is assumed to be in `initialState` when wgpu first touches it.
    returns:
      doc: |
        The texture, or NULL on failure (not Vulkan, or a descriptor that does not match the image).
      type: object.texture
    args:
      - name: device
        doc: |
          The device, which must be on Vulkan.
        type: object.device
      - name: image
        doc: |
          `VkImage`.
        type: c_void
        pointer: mutable
      - name: descriptor
        doc: |
          Describes the image.
        type: struct.texture_descriptor
        pointer: immutable
      - name: initial_state
        doc: |
          The state the image is in now.
        type: enum.codebrix_texture_state

  - name: codebrix_device_create_texture_from_d3d12_resource
    doc: |
      Wraps an application-owned `ID3D12Resource` as a wgpu texture. Same rules as
      @ref wgpuCodebrixDeviceCreateTextureFromVulkanImage; wgpu takes its own COM reference.
    returns:
      doc: |
        The texture, or NULL on failure.
      type: object.texture
    args:
      - name: device
        doc: |
          The device, which must be on Direct3D 12.
        type: object.device
      - name: resource
        doc: |
          `ID3D12Resource*`.
        type: c_void
        pointer: mutable
      - name: descriptor
        doc: |
          Describes the resource.
        type: struct.texture_descriptor
        pointer: immutable
      - name: initial_state
        doc: |
          The state the resource is in now.
        type: enum.codebrix_texture_state

  - name: codebrix_device_create_texture_from_metal_texture
    doc: |
      Wraps an application-owned `id<MTLTexture>` as a wgpu texture. Same rules as
      @ref wgpuCodebrixDeviceCreateTextureFromVulkanImage; wgpu retains the texture. (Metal has no
      explicit states; `initialState` is accepted for symmetry and ignored.)
    returns:
      doc: |
        The texture, or NULL on failure.
      type: object.texture
    args:
      - name: device
        doc: |
          The device, which must be on Metal.
        type: object.device
      - name: texture
        doc: |
          `id<MTLTexture>`.
        type: c_void
        pointer: mutable
      - name: descriptor
        doc: |
          Describes the texture.
        type: struct.texture_descriptor
        pointer: immutable
      - name: initial_state
        doc: |
          Ignored on Metal.
        type: enum.codebrix_texture_state

  - name: codebrix_command_encoder_transition_texture
    doc: |
      Records an explicit transition of the whole texture into `state` (wgpu-core
      `command_encoder_transition_resources`). Use it before handing a wgpu texture to a foreign owner
      (a SkiaSharp GRContext expects `ColorTarget` for a render target it draws into) and after taking
      it back, so both owners agree on the image layout / resource state. Submitting the encoder's
      command buffer performs the transition.
    returns:
      doc: |
        `WGPUStatus_Success`, or `WGPUStatus_Error` when the texture's usage does not permit `state`.
      type: enum.status
    args:
      - name: command_encoder
        doc: |
          The encoder to record into (not inside a pass).
        type: object.command_encoder
      - name: texture
        doc: |
          The texture.
        type: object.texture
      - name: state
        doc: |
          The target state.
        type: enum.codebrix_texture_state

  - name: codebrix_instance_adopt_vulkan_device
    doc: |
      Creates a wgpu adapter and device over an application-owned Vulkan device
      (wgpu-hal `Instance::from_raw` + `expose_adapter` + `Adapter::device_from_raw`, registered in the
      instance through wgpu-core's `create_adapter_from_hal` / `create_device_from_hal`). The queue is
      reached with `wgpuDeviceGetQueue` as usual. Release the device and adapter normally; the
      application's Vulkan objects are never destroyed by wgpu.
    returns:
      doc: |
        `WGPUStatus_Success`, or `WGPUStatus_Error` (reason through the log callback).
      type: enum.status
    args:
      - name: instance
        doc: |
          The wgpu instance that will own the adapter and device.
        type: object.instance
      - name: descriptor
        doc: |
          The Vulkan objects.
        type: struct.codebrix_vulkan_adopt_descriptor
        pointer: immutable
      - name: adapter
        doc: |
          Receives the adapter (NULL on failure).
        type: object.adapter
        pointer: mutable
      - name: device
        doc: |
          Receives the device (NULL on failure).
        type: object.device
        pointer: mutable

  - name: codebrix_instance_adopt_d3d12_device
    doc: |
      Direct3D 12 counterpart of @ref wgpuCodebrixInstanceAdoptVulkanDevice.
    returns:
      doc: |
        `WGPUStatus_Success` or `WGPUStatus_Error`.
      type: enum.status
    args:
      - name: instance
        doc: |
          The wgpu instance.
        type: object.instance
      - name: descriptor
        doc: |
          The Direct3D 12 objects.
        type: struct.codebrix_d3d12_adopt_descriptor
        pointer: immutable
      - name: adapter
        doc: |
          Receives the adapter.
        type: object.adapter
        pointer: mutable
      - name: device
        doc: |
          Receives the device.
        type: object.device
        pointer: mutable

  - name: codebrix_instance_adopt_metal_device
    doc: |
      Metal counterpart of @ref wgpuCodebrixInstanceAdoptVulkanDevice (wgpu-hal `Device::device_from_raw`).
    returns:
      doc: |
        `WGPUStatus_Success` or `WGPUStatus_Error`.
      type: enum.status
    args:
      - name: instance
        doc: |
          The wgpu instance.
        type: object.instance
      - name: descriptor
        doc: |
          The Metal device.
        type: struct.codebrix_metal_adopt_descriptor
        pointer: immutable
      - name: adapter
        doc: |
          Receives the adapter.
        type: object.adapter
        pointer: mutable
      - name: device
        doc: |
          Receives the device.
        type: object.device
        pointer: mutable

  - name: codebrix_get_proc_status
    doc: |
      What this library knows about one exported function: the function at `ordinal` in the function
      table (`WGPUCodebrixProcTable`; the ordinal is the entry's index, valid for the
      `WGPU_CODEBRIX_PROC_TABLE_SIGNATURE_HASH` of this library). Answered by the LOADED library from a
      table generated with it, so a module asks the binary it runs on, not the header it was built with.
      The same table is in include/codebrix_wgpu_procs.h / .rs (without the backend resolution).
    returns:
      doc: |
        The status; `WGPUCodebrixProcStatus_Unknown` for an ordinal outside the table.
      type: enum.codebrix_proc_status
    args:
      - name: ordinal
        doc: |
          The function-table index.
        type: uint32

  - name: codebrix_adapter_get_downlevel_capabilities
    doc: |
      Fills @ref WGPUCodebrixDownlevelCapabilities for an adapter.
    returns:
      doc: |
        `WGPUStatus_Success`, or `WGPUStatus_Error` for a null adapter or output.
      type: enum.status
    args:
      - name: adapter
        doc: |
          The adapter.
        type: object.adapter
      - name: capabilities
        doc: |
          Receives the capabilities.
        type: struct.codebrix_downlevel_capabilities
        pointer: mutable

  - name: codebrix_adapter_get_texture_format_features
    doc: |
      Fills @ref WGPUCodebrixTextureFormatFeatures for one format on an adapter. Works for every format
      the library knows, including ones whose feature (e.g. a compressed family) the adapter lacks - then
      the usages are empty.
    returns:
      doc: |
        `WGPUStatus_Success`, or `WGPUStatus_Error` for a null adapter or output or an unknown format.
      type: enum.status
    args:
      - name: adapter
        doc: |
          The adapter.
        type: object.adapter
      - name: format
        doc: |
          The format.
        type: enum.texture_format
      - name: features
        doc: |
          Receives the format's capabilities.
        type: struct.codebrix_texture_format_features
        pointer: mutable

  - name: codebrix_device_poll
    doc: |
      Polls or waits for the device's queue WITHOUT ever ending the process (wgpu-core `device_poll`
      with `PollType::Wait { submission_index, timeout }` or `PollType::Poll`). Callbacks of finished
      work (buffer maps, submitted-work-done) run during the call, whatever the result. Every failure
      comes back as a @ref WGPUCodebrixPollResult; nothing is reported through the device's error
      callbacks (a fault listener's device-lost callback runs once when the device is first seen lost).
    returns:
      doc: |
        `WGPUStatus_Success` when `result` is `QueueEmpty`, `WaitSucceeded` or `Poll`; `WGPUStatus_Error`
        otherwise (also for a null device, with `result` = `Error`).
      type: enum.status
    args:
      - name: device
        doc: |
          The device.
        type: object.device
      - name: wait
        doc: |
          True to block until the submission (or, without `submissionIndex`, the most recent one)
          finished or the timeout passed; false for one non-blocking poll.
        type: bool
      - name: timeout_ns
        doc: |
          The longest wait in nanoseconds; 0 waits without limit. Ignored when `wait` is false.
        type: uint64
      - name: submission_index
        doc: |
          The submission to wait for (from @ref wgpuQueueSubmitForIndex on this device), or NULL for the
          most recent one. Ignored when `wait` is false. (A `WGPUSubmissionIndex` of wgpu.h, spelled
          `uint64_t` so that this header needs only webgpu.h.)
        type: uint64
        pointer: immutable
        optional: true
      - name: result
        doc: |
          Receives the outcome (may be NULL when only the status matters).
        type: enum.codebrix_poll_result
        pointer: mutable
        optional: true

  - name: codebrix_vulkan_get_adopt_requirements
    doc: |
      Tells an application what to create its `VkDevice` with BEFORE calling
      @ref wgpuCodebrixInstanceAdoptVulkanDevice: fill the same
      @ref WGPUCodebrixVulkanAdoptDescriptor you will adopt with - `instance`, `physicalDevice`,
      `instanceApiVersion`, `getInstanceProcAddr`, `enabledInstanceExtensions` and `requiredFeatures`
      (wgpu and native feature names); `device`, the queue indices and `enabledDeviceExtensions` are
      ignored here. wgpu-hal inspects the physical device exactly as the adopt call will. Vulkan only.
    returns:
      doc: |
        `WGPUStatus_Success`, or `WGPUStatus_Error` (no Vulkan backend in this library, a missing handle,
        an unknown feature, a physical device wgpu cannot use, or a required feature it lacks; reason
        through the log callback). On error `requirements` is zeroed.
      type: enum.status
    args:
      - name: descriptor
        doc: |
          The Vulkan instance, physical device and requested features.
        type: struct.codebrix_vulkan_adopt_descriptor
        pointer: immutable
      - name: requirements
        doc: |
          Receives the requirements; release with @ref wgpuCodebrixVulkanAdoptRequirementsFreeMembers.
        type: struct.codebrix_vulkan_adopt_requirements
        pointer: mutable

  - name: codebrix_device_add_fault_listener
    doc: |
      Adds a fault listener to a device (the native half of a host-owned fault dispatcher): its
      callbacks run AFTER the device's own uncaptured-error / device-lost callbacks, which keep working
      unchanged - a listener never replaces or silences them. When the device has wgpu's DEFAULT
      uncaptured-error handler (no `uncapturedErrorCallbackInfo.callback` at creation, or an adopted
      device), that handler ends the process, so listeners run just BEFORE it instead (they see the fault,
      the process still ends). The listener lives until removed or until the device's last handle and
      every object created from it are released.
    returns:
      doc: |
        The listener id (never 0), or 0 on failure (null device, both callbacks NULL, or called from
        inside a fault callback).
      type: uint64
    args:
      - name: device
        doc: |
          The device.
        type: object.device
      - name: callbacks
        doc: |
          The callbacks and their userdata (copied).
        type: struct.codebrix_fault_callbacks
        pointer: immutable

  - name: codebrix_device_remove_fault_listener
    doc: |
      Removes a fault listener. When it returns, the listener's callbacks are not running and will not
      be called again.
    returns:
      doc: |
        `WGPUStatus_Success`, or `WGPUStatus_Error` when the device has no listener with that id (or when
        called from inside a fault callback).
      type: enum.status
    args:
      - name: device
        doc: |
          The device the listener was added to.
        type: object.device
      - name: listener_id
        doc: |
          The id @ref wgpuCodebrixDeviceAddFaultListener returned.
        type: uint64

  - name: codebrix_set_metal_precise_math
    doc: |
      Opts the process in to (or back out of) IEEE floating point for every WGSL shader the Metal
      backend compiles: Metal's default fast math lets its compiler assume no NaN or infinity,
      reassociate arithmetic and use approximate transcendental functions (measured on an Intel GPU:
      `x != x` false for a NaN, sin/cos tens of ulps off). WGSL's accuracy rules allow that, so it stays
      the default; a consumer whose kernels depend on IEEE behaviour (NaN checks, error-free sums,
      correctly rounded math) turns this on. On: `MTLMathModeSafe` and precise math functions (macOS 15
      / iOS 18 and later), fast math disabled before those systems. The Metal compiler may still fuse
      `a * b + c` into a fused multiply-add either way.

      Process-wide and off until called. It applies to pipelines created after the call (each
      pipeline's shaders are compiled to Metal when the pipeline is created), on every device; call it
      once, before creating any pipeline. Passthrough MSL is never changed. Metal only: elsewhere it
      returns `WGPUStatus_Error` and changes nothing (wgpu-hal patch, wgpu-native-tools/patches/0010).
    returns:
      doc: |
        `WGPUStatus_Success` on a build with the Metal backend (macOS); `WGPUStatus_Error` elsewhere.
      type: enum.status
    args:
      - name: enabled
        doc: |
          True for IEEE floating point; false for Metal's default fast math.
        type: bool

  - name: codebrix_device_create_pipeline_cache
    doc: |
      Creates a pipeline cache: the driver's store of compiled shader code, which a pipeline created
      with @ref WGPUCodebrixPipelineDescriptorExtras reads from and adds to, and which
      @ref wgpuCodebrixPipelineCacheGetData hands out for the host to save (to disk, per adapter: see
      @ref wgpuCodebrixAdapterGetPipelineCacheKey) and pass back here on a later run. On a device with a
      warm cache, creating a pipeline skips the driver's shader compilation (seconds per pipeline on
      some mobile drivers).

      Requires @ref WGPUNativeFeature_PipelineCache on the device, which only Vulkan adapters offer
      (wgpu-core 29): on Metal, Direct3D 12 and OpenGL the feature is absent, and creation reports a
      validation error through the device's error path and returns an invalid cache (never ends the
      process). Data from another adapter is a validation error; so is outdated or damaged data
      without `fallback`. An invalid cache is safe to release and to query (no data); chaining it makes pipeline
      creation fail validation.
    returns:
      doc: |
        The cache (never NULL for a valid device and descriptor; possibly invalid, see above). Release
        it with @ref wgpuCodebrixPipelineCacheRelease; pipelines created through it keep no reference.
      type: object.codebrix_pipeline_cache
    args:
      - name: device
        doc: |
          The device.
        type: object.device
      - name: descriptor
        doc: |
          The description.
        type: struct.codebrix_pipeline_cache_descriptor
        pointer: immutable

  - name: codebrix_adapter_get_pipeline_cache_key
    doc: |
      wgpu's name for an adapter's pipeline cache (Rust wgpu's `wgpu::util::pipeline_cache_key`):
      `wgpu_pipeline_cache_vulkan_<vendor>_<device>` with the decimal PCI vendor and device ids of the
      adapter. A host keeps one cache file per key (plus whatever identity of its own it adds, such as
      the library's build info), so a machine with two GPUs never feeds one GPU's data to the other.
      The driver version is not part of the key: it is checked inside the data (a cache saved before a
      driver update is replaced by an empty one when created with `fallback`).
    returns:
      doc: |
        `WGPUStatus_Success`; `WGPUStatus_Error` for a null adapter or output, or an adapter on a
        backend without pipeline caches (anything but Vulkan), and then `key` is not written.
      type: enum.status
    args:
      - name: adapter
        doc: |
          The adapter.
        type: object.adapter
      - name: key
        doc: |
          Receives the key, ASCII. The string is owned by the library and valid for the life of the
          process; never free it.
        type: out_string
        pointer: mutable

objects:
  - name: codebrix_pipeline_cache
    doc: |
      A pipeline cache (@ref wgpuCodebrixDeviceCreatePipelineCache): compiled shader code a device
      reuses between pipelines and, through @ref wgpuCodebrixPipelineCacheGetData, between runs of the
      program. Requires @ref WGPUNativeFeature_PipelineCache.
    methods:
      - name: get_data
        doc: |
          Copies out the cache's data, to persist and pass back to
          @ref wgpuCodebrixDeviceCreatePipelineCache on a later run: wgpu-core's header (adapter
          identity and a checksum) followed by the driver's own data. The usual two-call convention:
          call it with `data` NULL to learn the size, then with a buffer of at least that size. Each
          call asks the driver afresh, so pipelines created between the two calls can make the second
          answer larger than the first; when it is larger than `dataSize`, only `dataSize` bytes are
          written - repeat the size query rather than save a truncated blob. Thread-safe; save it after
          the pipelines a run needs have been created (off the render thread if it is large).
        returns:
          doc: |
            The full size of the data in bytes (the bytes written are the smaller of it and
            `dataSize`); 0 when the cache has no data to give: an invalid cache, a lost device or a
            backend without pipeline caches.
          type: usize
        args:
          - name: data
            doc: |
              Receives the data, or NULL to query the size only.
